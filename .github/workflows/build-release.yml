name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.expo.version' app.json)" >> $GITHUB_OUTPUT

      - name: Check tag matches version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match app.json version $VERSION — skipping build."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        id: build
        run: |
          eas build --platform android --profile preview --non-interactive --wait 2>&1 | tee build_output.txt
          ARTIFACT_URL=$(grep -oP 'https://\S+\.apk' build_output.txt | head -1)
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT
          cat build_output.txt

      - name: Download APK
        run: |
          curl -L "${{ steps.build.outputs.artifact_url }}" \
            -o "victoires-imf-v${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Version ${{ steps.version.outputs.version }}"
          files: victoires-imf-v${{ steps.version.outputs.version }}.apk
          body: |
            ## 🆕 Nouveautés
            - Page Victoires : total de victoires de la saison affiché en haut, nouveau bloc Matchs/Frags moy./Dmg moy./% Vict., et la liste des cartes gagnées n'est plus limitée à 5
            - Accueil : "TOP CARTES GAGNÉES" devient "TOP 5 CARTES GAGNÉES"

            ## 🐛 Corrections
            - "Win Rate" renommé en "% Vict." partout ; les victoires manuelles ne faussent plus le calcul du % de victoires (elles ne comptaient déjà pas dans les frags/dmg moyens)
            - Tri des cartes gagnées corrigé : nombre de victoires en priorité, ordre alphabétique en cas d'égalité
            - "Jamais synchronisé" ne s'affiche plus à tort sur un appareil qui n'a jamais lui-même déclenché de sync manuelle (on lit maintenant la vraie dernière synchro côté serveur)
