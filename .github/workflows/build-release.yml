name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.expo.version' app.json)" >> $GITHUB_OUTPUT

      - name: Check tag matches version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match app.json version $VERSION — skipping build."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        id: build
        run: |
          eas build --platform android --profile preview --non-interactive --wait 2>&1 | tee build_output.txt
          ARTIFACT_URL=$(grep -oP 'https://\S+\.apk' build_output.txt | head -1)
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT
          cat build_output.txt

      - name: Download APK
        run: |
          curl -L "${{ steps.build.outputs.artifact_url }}" \
            -o "victoires-imf-v${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Version ${{ steps.version.outputs.version }}"
          files: victoires-imf-v${{ steps.version.outputs.version }}.apk
          body: |
            ## 🎮 Nouveautés
            - Possibilité d'avoir 2 sessions de jeu confirmées la même semaine (ex: vendredi ET lundi) — notif "Nouvelle possibilité de session" quand une 2e date atteint 4 dispos
            - Nouveau système de sessions "retenues" : tape sur une date à 4/4 pour la marquer RETENUE (et inversement) — la notif "Ce soir on joue" ne part que sur les jours retenus
            - Nouveaux badges couleur sur le calendrier : orange (3/4), jaune (4/4), vert (RETENUE)
            - Les notifications de dispo attendent désormais un peu (jusqu'à 1h) avant de partir, pour laisser le temps à tout le monde de finir de voter et éviter les notifs contradictoires à la suite

            ## 🐛 Correctifs
            - Plusieurs décalages de date/heure liés au fuseau horaire corrigés (victoires, saisons, dates affichées) — impactait surtout les joueurs à l'étranger
            - Une session retenue qui perdait un vote restait affichée comme confirmée sans pouvoir être corrigée — réparé
            - Diverses corrections de fiabilité (petits bugs d'affichage liés à des chargements réseau qui revenaient dans le désordre, gestion des erreurs réseau silencieuses)
