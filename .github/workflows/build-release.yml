name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.expo.version' app.json)" >> $GITHUB_OUTPUT

      - name: Check tag matches version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match app.json version $VERSION — skipping build."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # Build entièrement local, sans EAS ni compte Expo : expo prebuild
      # génère le projet natif localement (aucun réseau/compte nécessaire),
      # puis Gradle compile et signe directement avec le vrai keystore de
      # production (extrait une fois depuis EAS le 19/09/2026, stocké
      # uniquement en secrets GitHub - jamais dans le repo).
      - name: Write .env for build-time EXPO_PUBLIC_* vars
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_PUBG_API_KEY=${{ secrets.EXPO_PUBLIC_PUBG_API_KEY }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # "tools" (paquet par défaut de cette action) n'existe plus dans le
      # dépôt Android SDK (déprécié par Google, sdkmanager échoue dessus) -
      # ubuntu-latest a déjà un SDK préinstallé, seul platform-tools sert ici.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build & sign APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "victoires-imf-v${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Version ${{ steps.version.outputs.version }}"
          files: victoires-imf-v${{ steps.version.outputs.version }}.apk
          body: |
            🔒 Sécurité
            - Mise à jour : la vérification de version et le téléchargement de l'APK passent maintenant par notre propre serveur (avant : accès direct à GitHub) - prépare le passage du dépôt en privé, sans rien changer pour toi
