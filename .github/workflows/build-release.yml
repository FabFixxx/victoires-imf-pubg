name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.expo.version' app.json)" >> $GITHUB_OUTPUT

      - name: Check tag matches version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match app.json version $VERSION — skipping build."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # Build local (--local) : compile directement sur ce runner au lieu
      # d'envoyer le job au service cloud EAS, qui a son propre quota mensuel
      # partagé avec seedbox-manager (même compte fabfix). Ne consomme aucun
      # quota EAS - seul le fetch du keystore de signature (via EXPO_TOKEN)
      # passe encore par le compte Expo.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # "tools" (paquet par défaut de cette action) n'existe plus dans le
      # dépôt Android SDK (déprécié par Google, sdkmanager échoue dessus) -
      # ubuntu-latest a déjà un SDK préinstallé, seul platform-tools sert ici.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: |
          set -o pipefail
          eas build --platform android --profile preview --local --non-interactive \
            --output "victoires-imf-v${{ steps.version.outputs.version }}.apk" 2>&1 | tee build_output.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Version ${{ steps.version.outputs.version }}"
          files: victoires-imf-v${{ steps.version.outputs.version }}.apk
          body: |
            ## 🎨 Nouveautés
            - Thème clair, en plus du thème sombre habituel (qui reste celui par défaut) : réglable dans Réglages → Apparence, avec un choix "Système" qui suit automatiquement le thème du téléphone
