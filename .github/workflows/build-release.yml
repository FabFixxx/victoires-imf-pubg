name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.expo.version' app.json)" >> $GITHUB_OUTPUT

      - name: Check tag matches version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match app.json version $VERSION — skipping build."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        id: build
        run: |
          eas build --platform android --profile preview --non-interactive --wait 2>&1 | tee build_output.txt
          ARTIFACT_URL=$(grep -oP 'https://\S+\.apk' build_output.txt | head -1)
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT
          cat build_output.txt

      - name: Download APK
        run: |
          curl -L "${{ steps.build.outputs.artifact_url }}" \
            -o "victoires-imf-v${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Version ${{ steps.version.outputs.version }}"
          files: victoires-imf-v${{ steps.version.outputs.version }}.apk
          body: |
            ## 🔄 Synchronisation serveur
            - La sync PUBG tourne désormais côté serveur chaque nuit à 3h — la clé API n'est plus dans l'app
            - Historique des synchronisations accessible depuis Réglages (date, durée, statut Auto/Manuel)
            - Sync manuelle toujours disponible via les boutons de l'app
            - Temps de sync réduit de ~13s à ~2s quand tout est déjà à jour

            ## 🧹 Nettoyage
            - Suppression de "Tester la connexion" et de la sync automatique au démarrage
            - Suppression du code PUBG API côté client (devenu inutile)
